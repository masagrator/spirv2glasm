# Build every probe shader from source with glslang 16.6.0 (pinned), convert
# it with the Python converter, and compare byte for byte with the expected
# listing (spirv2glasm/tools/probecheck.py).  No SPIR-V is kept in the
# repository.
#
# LAYOUT: the repository root holds only this .github/ folder and the
# project folder spirv2glasm/; every project path below is under it, and the
# check runs with spirv2glasm/ as its working directory.  The probe sources
# and their expected listings travel as ONE archive, spirv2glasm/probes.7z
# (probes/ and listings/ inside), which the first step unpacks.
#
# glslang is PINNED to a release, not `main`: the expected listings are the
# oracle's output for 16.6.0's SPIR-V, and a moving glslang could change the
# SPIR-V (and so the listing) without any change here.  The release's
# prebuilt Linux package is downloaded and checked against its SHA-256.
name: probes

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GLSLANG_VERSION: "16.6.0"
  GLSLANG_URL: https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.zip
  GLSLANG_SHA256: a3fc4f083b1793eb53e55fa3577ac9649ffbe0340715e30d116290fb5382393f

jobs:
  probes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the newest stable Python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Download glslang ${{ env.GLSLANG_VERSION }}
        run: |
          set -eux
          curl -sSfL -o "$RUNNER_TEMP/glslang.zip" "$GLSLANG_URL"
          echo "$GLSLANG_SHA256  $RUNNER_TEMP/glslang.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/glslang.zip" -d "$RUNNER_TEMP/glslang"
          "$RUNNER_TEMP/glslang/bin/glslangValidator" --version | tee version.txt
          grep -q "Glslang Version: .*${GLSLANG_VERSION}" version.txt

      # The glslang package has no spirv-as; it assembles the hand-written
      # probes (probes/*.spvasm).  7-Zip unpacks the probe archive.
      - name: Install SPIRV-Tools and 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools p7zip-full
          spirv-as --version

      - name: Unpack the probes
        working-directory: spirv2glasm
        run: |
          7z x -y probes.7z > /dev/null
          ls probes | wc -l
          ls listings | wc -l

      # Two worker processes, each compiling and converting a batch of
      # probes with the converter imported once (tools/probecheck.py -j).
      - name: Check probes
        working-directory: spirv2glasm
        run: |
          python3 tools/probecheck.py \
              --glslang "$RUNNER_TEMP/glslang/bin/glslangValidator" \
              -j 2
